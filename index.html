<!doctype html> 
<html lang="en"> 
<head> 
<meta charset="utf-8"> 
<meta name="viewport" content="width=device-width,initial-scale=1"> 
<title>Ledger - CSE Report Analyst</title> 
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script> 
<style> 
:root{--ink:#16283d;--paper:#f3ecdc;--gold:#b8863f;--text:#2a2622;--rule:#d9cfb8;--danger:#9c4a3c}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--text);font:14px Arial,sans-serif}.app{display:flex;min-height:100vh}.side{width:300px;background:var(--ink);color:var(--paper);padding:24px}.side h1{font:600 30px Georgia;margin:4px 0}.mark,.ticker{color:var(--gold);font:12px monospace;text-transform:uppercase}.ticker{padding:10px 0;border-top:1px solid #ffffff22;border-bottom:1px solid #ffffff22}.upload{display:block;margin-top:22px;padding:24px 12px;text-align:center;border:1px dashed #ffffff66;cursor:pointer}.upload:hover{border-color:var(--gold)}input[type=file]{display:none}.stage{flex:1;padding:36px}.empty{text-align:center;margin-top:25vh}.item{padding:11px;margin-top:8px;background:#ffffff0b;cursor:pointer;border-left:3px solid transparent}.item.active{border-color:var(--gold)}.metrics{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:1px;background:var(--rule);border:1px solid var(--rule)}.metric{padding:16px;background:var(--paper)}.metric b{display:block;margin-top:7px;color:var(--ink);font:600 19px monospace}.tabs{display:flex;gap:24px;margin:18px 0}.tab{cursor:pointer;padding:8px 0;border-bottom:2px solid transparent}.tab.active{border-color:var(--gold)}section{border-top:1px solid var(--rule);margin-top:25px;padding-top:15px}section h2{font-family:Georgia;color:var(--ink)}.evidence,.notice{padding:12px;border-left:3px solid var(--gold);background:#b8863f11;line-height:1.6}.error{color:var(--danger);border-color:var(--danger)}@media(max-width:720px){.app{display:block}.side{width:100%}} 
</style> 
</head> 
<body> 
<div class="app"> 
<aside class="side"> 
  <div class="mark">Colombo Stock Exchange</div> 
  <h1>Ledger</h1> 
  <p>Browser-only PDF screening. No Anthropic API key and no server upload.</p> 
  <div class="ticker" id="ticker">Ready - local analysis only</div> 
  <label class="upload">+<br>Drop PDF reports here<br>or click to browse<input id="files" type="file" accept="application/pdf" multiple></label> 
  <div id="list"></div> 
</aside> 
<main class="stage" id="stage"></main> 
</div> 
<script> 
pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js'; 
const state={reports:[],active:null,tab:'numbers'}; 
const el=id=>document.getElementById(id); 
const escapeHtml=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); 
function sentences(text){return text.replace(/\s+/g,' ').split(/(?<=[.!?])\s+/).filter(s=>s.length>35&&s.length<420)} 
function evidence(text,words){const list=sentences(text);for(const word of words){const hit=list.find(s=>s.toLowerCase().includes(word.toLowerCase()));if(hit)return hit}return ''} 
function metric(text,label,pattern,suffix=''){const hit=text.match(pattern);return hit?{label,value:hit[1].trim()+suffix}:null} 
function analyze(name,text){ 
 const metrics=[ 
  metric(text,'Revenue',/(?:revenue|turnover)[^0-9]{0,50}((?:LKR|Rs\.?)?\s*[\d,.]+\s*(?:million|billion|mn|bn)?)/i), 
  metric(text,'Net Profit',/(?:profit after tax|net profit)[^0-9]{0,50}((?:LKR|Rs\.?)?\s*[\d,.]+\s*(?:million|billion|mn|bn)?)/i), 
  metric(text,'ROE',/(?:return on equity|ROE)[^0-9]{0,35}([\d,.]+\s*%)/i), 
  metric(text,'Net Margin',/net margin[^0-9]{0,35}([\d,.]+\s*%)/i) 
 ].filter(Boolean); 
 const revenue=evidence(text,['revenue','turnover','sales']); 
 const growth=evidence(text,['growth','increased','expanded']); 
 const risk=evidence(text,['risk','uncertainty','decline','impairment']); 
 const debt=evidence(text,['borrowings','debt','liquidity','cash flow']); 
 const strategy=evidence(text,['strategy','strategic','long term']); 
 return {metrics,sections:[ 
  ['1. Business Snapshot',revenue||'No clear business or revenue statement was matched automatically.'], 
  ['2. Lynch Pitch - The Bull Case',growth||'No clear growth statement was matched. Review revenue, volumes, margins and segment notes.'], 
  ['3. Munger Invert - The Bear Case',risk||'No risk sentence was matched. Review principal risks, contingencies, related parties and auditor notes.'], 
  ['4. Financial Quality Read',debt||'Insufficient matched text to assess leverage or liquidity reliably. Verify the statements manually.'], 
  ['5. Strategic Response Lens',strategy||'No clear strategy statement was matched. Competitive dynamics require additional evidence.'] 
 ]}; 
} 
async function extract(file){ 
 const pdf=await pdfjsLib.getDocument({data:await file.arrayBuffer()}).promise; 
 let text=''; 
 for(let pageNo=1;pageNo<=Math.min(pdf.numPages,120);pageNo++){ 
  const page=await pdf.getPage(pageNo); 
  const content=await page.getTextContent(); 
  text+=content.items.map(item=>item.str).join(' ')+'\n'; 
  if(text.length>250000)break; 
 } 
 if(text.trim().length<200)throw Error('Very little text was extracted. The PDF may require OCR.'); 
 return text; 
} 
async function addReport(file){ 
 const report={id:crypto.randomUUID(),name:file.name,status:'working'}; 
 state.reports.push(report);state.active=report.id;render(); 
 try{report.result=analyze(report.name,await extract(file));report.status='done';el('ticker').textContent='Analyzed locally - '+report.name} 
 catch(error){report.status='error';report.error=error.message} 
 render(); 
} 
el('files').addEventListener('change',event=>[...event.target.files].filter(file=>file.name.toLowerCase().endsWith('.pdf')).forEach(addReport)); 
function render(){ 
 const list=el('list');list.innerHTML=''; 
 state.reports.forEach(report=>{const row=document.createElement('div');row.className='item '+(report.id===state.active?'active':'');row.textContent=report.name+' - '+report.status;row.onclick=()=>{state.active=report.id;render()};list.appendChild(row)}); 
 const report=state.reports.find(item=>item.id===state.active),stage=el('stage'); 
 if(!report){stage.innerHTML='<div class="empty"><h2>No report open</h2><p>Upload an annual or quarterly report for local screening.</p></div>';return} 
 if(report.status==='working'){stage.innerHTML='<div class="notice">Reading and screening the PDF locally...</div>';return} 
 if(report.status==='error'){stage.innerHTML='<div class="notice error">'+escapeHtml(report.error)+'</div>';return} 
 const tabs='<div class="tabs"><div class="tab '+(state.tab==='numbers'?'active':'')+'" data-tab="numbers">Key Numbers</div><div class="tab '+(state.tab==='analysis'?'active':'')+'" data-tab="analysis">Framework</div></div>'; 
 let body=''; 
 if(state.tab==='numbers')body='<div class="notice">Heuristic matches only. Verify every value and period against the original report.</div><div class="metrics">'+(report.result.metrics.length?report.result.metrics.map(m=>'<div class="metric">'+escapeHtml(m.label)+'<b>'+escapeHtml(m.value)+'</b></div>').join(''):'<div class="metric">No reliable metric matches found.</div>')+'</div>'; 
 else body=report.result.sections.map(([heading,text])=>'<section><h2>'+escapeHtml(heading)+'</h2><p>'+escapeHtml(text)+'</p><div class="evidence">Matched report text or local screening result</div></section>').join(''); 
 stage.innerHTML='<h1>'+escapeHtml(report.name.replace(/\.pdf$/i,''))+'</h1><p>No external AI API</p>'+tabs+body; 
 stage.querySelectorAll('.tab').forEach(tab=>tab.onclick=()=>{state.tab=tab.dataset.tab;render()}); 
} 
render(); 
</script> 
</body> 
</html>
